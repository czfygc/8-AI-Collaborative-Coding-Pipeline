# Research Architect（下游，不是 Reviewer）——两模式共用
architect:
  name: chatgpt
  display_name: "ChatGPT"
  url_match: "chatgpt\\.com"
  url_open: "https://chatgpt.com/"
  role: "Research Architect"
  consumes: "delta.md"
  produces: "architect-decision.md"
  editor_selector: '[contenteditable="true"].ProseMirror'
  # T-62（2026-10-14 实探）：新 UI 为 app-shell/Workspace 结构——[data-message-author-role]
  # 等全部 message 标记属性命中 0（连 article/.markdown 都是 0），正文在 main 容器。
  # response_selector 前插进捕获选择器列表（注入修复后 marker 通道为主，此为第二通道）。
  response_selector: "main"
  # T-58（2026-10-13 实测）：ChatGPT 前端换新——#prompt-textarea 已不存在，
  # 编辑器为 ProseMirror contenteditable；附件 hidden input 有 4 个（.hidden 类）
  # 直传走第一枚、确认失败自动降级拖拽（drop 目标=编辑器中心）。
  # scan 附件通道（T-40）：uploadFileToTab 强制要求 file_input_selector；
  # 常驻 input[type=file] 找不到时会自动回落 input[type=file] 通用查找 → 拖拽模拟兜底
  upload_strategy: "direct"
  file_input_selector: 'input[type="file"]'
  upload_button_selector: null
  upload_menu_item_text: null
  upload_wait_ms: 3000

# 严重度阈值：决定哪些单方发现升级到 DELTA
thresholds:
  blind_spot_to_delta: "HIGH"
  single_reviewer_to_delta: "HIGH"
  single_reviewer_to_backlog: ["LOW", "MEDIUM"]

# 已知误判过滤器：命中后写入 filtered.json + delta.md 的 Filtered Findings 段
filters:
  - ruleId: "FILTER-ABSOLUTE-PATH-001"
    pattern: "absolute path|硬编码路径|绝对路径"
    reason: "In audit context, absolute paths are evidence anchors, not defects."

  - ruleId: "FILTER-RUNTIME-ID-001"
    pattern: "transient|runtime id|PID|browserWS|ephemeral|瞬态"
    reason: "Runtime identifiers are chain-of-custody anchors; removing them breaks verifiability."

  - ruleId: "FILTER-OUT-OF-SCOPE-EVIDENCE-001"
    pattern: "报告没有证明|outside the artifact|report does not prove"
    reason: "Review scope is the artifact itself; out-of-scope evidence demands are not findings."

  - ruleId: "FILTER-LINE-LENGTH-001"
    pattern: "行宽|line length|单行过长"
    reason: "Line-length is a style preference, not an audit defect."

  - ruleId: "FILTER-MISSING-COMMENT-001"
    pattern: "缺少注释|建议添加注释"
    reason: "Comment-suggestion findings are style/code-quality preferences, not audit defects."